# CRAN's after-the-fact checks on the C layer, from pedrobtz/r-actions: the
# ones its check page lists under "Additional issues". src/agile.c, src/cfb.c
# and src/encinfo.c parse untrusted input and hold key material, so ASan,
# valgrind and rchk matter here more than the R CMD check matrix does.
#
# cran-special includes the non-UTF-8 locale run that would have caught the
# test password fixed in #72.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - 'docs/**'
      - '_pkgdown.yml'
  pull_request:
  workflow_dispatch:

name: native-checks.yaml

permissions: read-all

jobs:
  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      fail-on-findings: true

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      valgrind-opts: >-
        --leak-check=full
        --show-leak-kinds=definite,indirect
        --errors-for-leak-kinds=definite,indirect

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      exclude: src/vendor
      fail-on-findings: true

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
