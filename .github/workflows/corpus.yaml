# The external interoperability corpus (design section 17.2 to 17.3).
#
# Separate from R-CMD-check.yaml on purpose. This job fetches 20 MB of other
# projects' workbooks over the network, so it is slower and has a failure mode
# the package's own suite must never inherit. Nothing here ships to CRAN:
# tools/corpus is excluded by .Rbuildignore.
#
# One platform is enough. The corpus tests what the reader makes of real
# files, which does not vary by operating system; R-CMD-check.yaml is what
# covers platforms.
on:
  push:
    branches: [main, master]
  pull_request:

name: corpus.yaml

permissions: read-all

jobs:
  corpus:
    runs-on: ubuntu-latest
    name: external corpus

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::devtools
          needs: check

      # checksums.sha256 determines the contents of files/ exactly, so it is
      # the natural cache key: the cache can only be reused when it holds the
      # corpus that is being asked for. restore-keys lets an older corpus come
      # back as a starting point, which is safe because fetch re-downloads any
      # file whose checksum does not already match.
      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: tools/corpus/files
          key: corpus-${{ hashFiles('tools/corpus/checksums.sha256') }}
          restore-keys: corpus-

      # Fetches anything missing into tools/corpus/files and verifies every
      # byte against the committed checksums, so a moved or rewritten upstream
      # file fails here rather than silently changing what is being tested.
      # On a cache hit this downloads nothing.
      - name: Fetch corpus
        run: ./tools/corpus/fetch

      # Compares each file's outcome against tools/corpus/expected.tsv. A file
      # that starts failing, or starts passing, is reported either way.
      - name: Read corpus
        run: ./tools/corpus/run
